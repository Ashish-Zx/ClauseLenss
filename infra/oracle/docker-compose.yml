services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: clauselens-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MODEL_DTYPE=float32          # full precision on Oracle's 24GB
    volumes:
      - ./data:/app/backend/data       # persists uploaded PDFs / indices
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
